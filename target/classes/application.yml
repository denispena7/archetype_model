spring:
application:
name: prototipo-alumnos
# Selecciona el perfil activo: 'postgres'; o ''mysql';
profiles:
active: mysql
# Configuración común de Thymeleaf
thymeleaf:
cache: false
prefix: classpath:/templates/
suffix: .html
---
# ==========================================
# PERFIL 1: POSTGRESQL
# ==========================================
spring:
config:
activate:
on-profile: postgres
datasource:
url: jdbc:postgresql://{DB_PORT:5432}/${DB_NAME:escuela_db}
username: ${DB_USER:postgres}
password: ${DB_PASS:postgres}
driver-class-name: org.postgresql.Driver
jpa:
database-platform: org.hibernate.dialect.PostgreSQLDialect
hibernate:
ddl-auto: update
show-sql: true
---
# ==========================================
# PERFIL 2: MYSQL
# ==========================================
spring:
config:
activate:
on-profile: mysql
datasource: 
url: jdbc:mysql://${DB_PORT:3306}/${DB_NAME:escuela_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
username: ${DB_USER:root}
password: ${DB_PASS:root}
driver-class-name: com.mysql.cj.jdbc.Driver
jpa:
database-platform: org.hibernate.dialect.MySQLDialect
hibernate:
ddl-auto: update
show-sql: true